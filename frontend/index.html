<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE3" />
    <meta name="description" content="Найдите компанию для спорта: кто собирается, где, когда и как присоединиться." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Спортивный клуб</title>
    <script>
      // Повторяет applyToDocument из src/features/accessibility.tsx
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("a11y-settings") || "{}");
          var root = document.documentElement;
          if (s.lowVision === true) root.setAttribute("data-low-vision", "");
          if (s.colorSafe === true) {
            root.setAttribute("data-color-safe", "");
            root.setAttribute("data-color-type", s.colorType === "protan" || s.colorType === "tritan" ? s.colorType : "deutan");
          }
          if (s.simple === true) root.setAttribute("data-simple", "");
          root.setAttribute("data-text-size", String(s.textSize === 1 || s.textSize === 2 ? s.textSize : 0));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
